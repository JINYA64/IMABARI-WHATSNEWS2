<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今治市 更新情報ボード</title>
<style>
  :root{
    --bg-deep:#0F2534; --bg-panel:#17394E; --bg-panel-2:#1C4258;
    --cream:#F6F2E8; --cream-dim:#D9D2C2;
    --mikan:#E8752C; --mikan-soft:#F0975A; --teal:#3E8FA6;
    --ink-soft:#B9CBD4; --divider:rgba(246,242,232,0.14);
    --shadow:0 30px 60px -20px rgba(0,0,0,0.55);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;
    background:radial-gradient(1200px 600px at 15% -10%, #1D4C64 0%, transparent 60%),
      radial-gradient(1000px 700px at 110% 10%, #123549 0%, transparent 55%), var(--bg-deep);
    color:var(--cream); font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    overflow:hidden;}
  .stage{height:100vh;display:flex;flex-direction:column;padding:clamp(16px,3vw,36px);gap:clamp(12px,2vw,20px);}
  .header{display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .brand{display:flex;align-items:center;gap:14px;}
  .wave-mark{width:46px;height:46px;flex:0 0 auto;}
  .brand-text h1{margin:0;font-family:"Noto Serif JP",serif;font-weight:600;font-size:clamp(18px,2.4vw,26px);letter-spacing:.04em;}
  .brand-text p{margin:2px 0 0;font-size:12px;letter-spacing:.18em;color:var(--ink-soft);text-transform:uppercase;}
  .clock-block{text-align:right;}
  .clock{font-family:"Noto Serif JP",serif;font-size:clamp(20px,2.6vw,30px);font-variant-numeric:tabular-nums;}
  .date-line{font-size:12px;color:var(--ink-soft);margin-top:2px;letter-spacing:.06em;}
  .sync-line{font-size:11px;color:var(--ink-soft);margin-top:2px;opacity:.75;}
  .board{flex:1;display:flex;align-items:center;justify-content:center;perspective:2400px;}
  .card{position:relative;width:min(940px,92%);background:linear-gradient(165deg,var(--bg-panel-2),var(--bg-panel));
    border:1px solid var(--divider);border-radius:22px;box-shadow:var(--shadow);
    padding:clamp(28px,5vw,56px) clamp(28px,6vw,64px);transform-style:preserve-3d;transform-origin:center 30%;}
  .card::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--divider);}
  .card.flip-out{animation:flipOut .32s cubic-bezier(.5,0,.75,0) forwards;}
  .card.flip-in{animation:flipIn .38s cubic-bezier(.25,1,.5,1) forwards;}
  @keyframes flipOut{to{transform:rotateX(-90deg);opacity:.4;}}
  @keyframes flipIn{from{transform:rotateX(90deg);opacity:.4;}to{transform:rotateX(0deg);opacity:1;}}
  @media (prefers-reduced-motion: reduce){.card.flip-out,.card.flip-in{animation:none !important;}}
  .row-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px;}
  .date-badge{font-family:"Noto Serif JP",serif;font-size:clamp(14px,1.6vw,17px);background:rgba(246,242,232,0.08);
    border:1px solid var(--divider);padding:6px 16px;border-radius:999px;letter-spacing:.05em;}
  .date-badge b{color:var(--mikan-soft);font-weight:700;}
  .cat-tag{font-size:12px;letter-spacing:.08em;padding:6px 14px;border-radius:999px;color:var(--bg-deep);font-weight:700;background:var(--teal);}
  .cat-tag[data-cat="募集・イベント"]{background:var(--mikan-soft);}
  .cat-tag[data-cat="補助金・支援"]{background:#9CC9A1;}
  .cat-tag[data-cat="交通・航路"]{background:var(--teal);}
  .cat-tag[data-cat="入札・プロポーザル"]{background:#B7A6D9;}
  .cat-tag[data-cat="お知らせ"]{background:#C9BFAE;}
  .headline{font-family:"Noto Serif JP",serif;font-weight:700;font-size:clamp(22px,3.6vw,36px);line-height:1.5;min-height:1.6em;}
  .summary{margin-top:14px;font-size:clamp(14px,1.7vw,17px);line-height:1.7;color:var(--cream-dim);min-height:2.4em;}
  .link-line{margin-top:10px;font-size:12px;color:var(--ink-soft);word-break:break-all;}
  .link-line a{color:var(--mikan-soft);text-decoration:none;}
  .card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:24px;font-size:12px;color:var(--ink-soft);letter-spacing:.04em;}
  .progress-wrap{height:3px;width:180px;background:rgba(246,242,232,0.12);border-radius:3px;overflow:hidden;}
  .progress-bar{height:100%;width:0%;background:var(--mikan-soft);}
  .controls{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:2px;}
  .ctrl-btn{background:rgba(246,242,232,0.08);border:1px solid var(--divider);color:var(--cream);font-size:13px;
    padding:8px 16px;border-radius:999px;cursor:pointer;letter-spacing:.03em;font-family:inherit;}
  .ctrl-btn:hover{background:rgba(246,242,232,0.16);}
  .counter{font-size:12px;color:var(--ink-soft);letter-spacing:.08em;min-width:64px;text-align:center;}
  .ticker{border-top:1px solid var(--divider);padding-top:12px;overflow:hidden;position:relative;height:26px;}
  .ticker::before{content:"NEWS";position:absolute;left:0;top:12px;font-size:11px;letter-spacing:.2em;color:var(--mikan-soft);
    font-weight:700;background:var(--bg-deep);padding-right:10px;z-index:2;}
  .ticker-track{position:absolute;left:70px;right:0;top:12px;white-space:nowrap;display:inline-block;
    animation:scroll-left 65s linear infinite;font-size:13px;color:var(--ink-soft);}
  .ticker-track span{margin-right:48px;}
  @keyframes scroll-left{from{transform:translateX(0);}to{transform:translateX(-50%);}}
  .state-msg{color:var(--ink-soft);text-align:center;font-size:15px;}
</style>
</head>
<body>
<div class="stage">
  <header class="header">
    <div class="brand">
      <svg class="wave-mark" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="24" cy="24" r="23" stroke="#F6F2E8" stroke-opacity="0.25"/>
        <path d="M6 20c4-5 8-5 12 0s8 5 12 0 8-5 12 0" stroke="#3E8FA6" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M6 28c4-5 8-5 12 0s8 5 12 0 8-5 12 0" stroke="#E8752C" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
      <div class="brand-text">
        <h1>今治市 更新情報ボード</h1>
        <p>City of Imabari &mdash; What's New</p>
      </div>
    </div>
    <div class="clock-block">
      <div class="clock" id="clock">--:--:--</div>
      <div class="date-line" id="today">----年--月--日（-）</div>
      <div class="sync-line" id="syncLine">news.json 読み込み中…</div>
    </div>
  </header>

  <div class="board">
    <div class="card" id="card">
      <div id="cardBody">
        <p class="state-msg">news.json を読み込んでいます…</p>
      </div>
    </div>
  </div>

  <div class="controls" id="controls" style="visibility:hidden;">
    <button class="ctrl-btn" id="prevBtn">◀ 前へ</button>
    <button class="ctrl-btn" id="playBtn">⏸ 一時停止</button>
    <button class="ctrl-btn" id="nextBtn">次へ ▶</button>
    <span class="counter" id="speedLabel">切替：6秒ごと</span>
  </div>

  <div class="ticker"><div class="ticker-track" id="tickerTrack"></div></div>
</div>

<script>
const WEEKDAYS = ["日","月","火","水","木","金","土"];
const INTERVAL_MS = 6000;
const NEWS_JSON_URL = "./news.json";      // 同じフォルダの news.json を読む
const RELOAD_CHECK_MS = 5 * 60 * 1000;    // 5分ごとに news.json の更新有無を確認

let NEWS = [];
let idx = 0, timer = null, playing = true, startTime = null;

const cardEl = document.getElementById('card');
const cardBody = document.getElementById('cardBody');
const counterWrap = () => document.getElementById('counter');
const progressWrap = () => document.getElementById('progressBar');

function formatDate(iso){
  const d = new Date(iso + "T00:00:00");
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${WEEKDAYS[d.getDay()]}）`;
}

function cardTemplate(item, i){
  return `
    <div class="row-top">
      <span class="date-badge"><b>${formatDate(item.date)}</b></span>
      <span class="cat-tag" data-cat="${item.category}">${item.category}</span>
    </div>
    <div class="headline">${item.title}</div>
    <div class="summary">${item.summary || ""}</div>
    <div class="link-line">
      ${item.official_title && item.official_title !== item.title ? `正式名称：${item.official_title}<br>` : ""}
      <a href="${item.url}" target="_blank" rel="noopener">今治市サイトで詳細を見る ↗</a>
    </div>
    <div class="card-foot">
      <span id="counter">${i+1} / ${NEWS.length}</span>
      <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    </div>`;
}

function renderItem(i, animate){
  const item = NEWS[i];
  const apply = () => { cardBody.innerHTML = cardTemplate(item, i); };
  if(animate && !window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    cardEl.classList.add('flip-out');
    setTimeout(()=>{
      apply();
      cardEl.classList.remove('flip-out');
      cardEl.classList.add('flip-in');
      setTimeout(()=> cardEl.classList.remove('flip-in'), 400);
    }, 300);
  } else { apply(); }
}

function goTo(i, animate=true){
  if(NEWS.length === 0) return;
  idx = (i + NEWS.length) % NEWS.length;
  renderItem(idx, animate);
  startTime = performance.now();
}
function next(){ goTo(idx+1); }
function prev(){ goTo(idx-1); }

function tickProgress(){
  const bar = progressWrap();
  if(playing && startTime !== null && bar){
    const elapsed = performance.now() - startTime;
    bar.style.width = Math.min(100, (elapsed / INTERVAL_MS) * 100) + "%";
  }
  requestAnimationFrame(tickProgress);
}
function startAutoplay(){ clearInterval(timer); timer = setInterval(next, INTERVAL_MS); startTime = performance.now(); }
function stopAutoplay(){ clearInterval(timer); }

document.getElementById('nextBtn').addEventListener('click', ()=>{ next(); if(playing) startAutoplay(); });
document.getElementById('prevBtn').addEventListener('click', ()=>{ prev(); if(playing) startAutoplay(); });
document.getElementById('playBtn').addEventListener('click', (e)=>{
  playing = !playing;
  e.target.textContent = playing ? "⏸ 一時停止" : "▶ 再生";
  if(playing){ startAutoplay(); } else { stopAutoplay(); }
});

function buildTicker(){
  const track = document.getElementById('tickerTrack');
  const text = NEWS.map(n => `【${n.date.slice(5).replace('-','/')}】${n.title}`);
  const doubled = text.concat(text);
  track.innerHTML = doubled.map(t => `<span>${t}</span>`).join('');
}

async function loadNews(){
  try{
    const res = await fetch(NEWS_JSON_URL, {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    NEWS = data.items || [];
    document.getElementById('syncLine').textContent =
      NEWS.length ? `最終更新: ${data.generated_at}` : "直近7日分のお知らせはありません";
    if(NEWS.length === 0){
      cardBody.innerHTML = '<p class="state-msg">直近7日間の更新情報はまだありません。</p>';
      return;
    }
    document.getElementById('controls').style.visibility = "visible";
    buildTicker();
    renderItem(0, false);
    startAutoplay();
  }catch(err){
    document.getElementById('syncLine').textContent = "news.json を読み込めませんでした";
    cardBody.innerHTML = `<p class="state-msg">news.json の読み込みに失敗しました（${err.message}）。<br>
      GitHub Actions が正常に動いているか、docs/news.json が存在するかご確認ください。</p>`;
  }
}

// 時計
function updateClock(){
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  document.getElementById('clock').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  document.getElementById('today').textContent = formatDate(now.toISOString().slice(0,10));
}
updateClock();
setInterval(updateClock, 1000);

// 定期的に news.json の再取得を試みる（バッチ更新を自動反映）
setInterval(loadNews, RELOAD_CHECK_MS);

loadNews();
requestAnimationFrame(tickProgress);
</script>
</body>
</html>
