name: 今治市お知らせを毎日更新

on:
  schedule:
    # 毎日 JST 07:30 に実行（UTC 22:30 = JST 07:30 の前日）
    - cron: "30 22 * * *"
  workflow_dispatch: {}   # 手動実行ボタン用

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: pip install requests beautifulsoup4

      - name: 今治市サイトを巡回して news.json を更新
        env:
          # Settings → Secrets and variables → Actions で登録すると
          # Gemini（無料枠）によるやさしい言い換えが有効になる。
          # 未設定でもルールベースの言い換えで動作する。
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scrape_imabari_news.py

      - name: 変更があればコミット
        run: |
          git config user.name "imabari-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/news.json
          git diff --cached --quiet || git commit -m "chore: update news.json ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
