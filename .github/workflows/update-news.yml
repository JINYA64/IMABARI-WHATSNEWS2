name: 今治市お知らせを毎日更新

on:
  schedule:
    # 毎日 JST 07:30 に実行（UTC 22:30 = JST 07:30 の前日）
    - cron: "30 22 * * *"
  workflow_dispatch: {}   # 手動実行ボタン用

permissions:
  contents: write
  models: read   # GitHub Models（無料AI）の呼び出しに必要

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: pip install requests beautifulsoup4

      - name: 今治市サイトを巡回して news.json を更新
        env:
          # Actionsが自動発行するトークン。追加のサインアップ・課金登録は不要。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scrape_imabari_news.py

      - name: 変更があればコミット
        run: |
          git config user.name "imabari-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/news.json
          git diff --cached --quiet || git commit -m "chore: update news.json ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
