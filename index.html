async function respondMultiResponse(choice, cardUid, farmerUid){
  // choice: 'discard' (cardUidを捨てる) または 'damage'（1点の負傷、農民があれば軽減可）
  await updateGame(CODE, (state)=>{
    const pac = state.pendingActionCard;
    if(!pac || pac.mode!=="multiResponse") return false;
    if(!pac.targets.includes(ME.id) || pac.responded.includes(ME.id)) return false;
    const p = state.playerState[ME.id];
    if(choice==="discard"){
      const idx = p.hand.findIndex(c=>c.uid===cardUid);
      if(idx===-1) return false;
      const need = pac.kind==="discardWeaponOrDamage" ? "武器" : null;
      const card = p.hand[idx];
      if(need && card.kind!==need) return false;
      if(pac.kind==="discardParryOrDamage" && card.name!=="捌き") return false;
      p.hand.splice(idx,1);
      pushDiscard(state, card);
      log(state, `${p.name} が「${card.name}」を捨てて「${pac.cardName}」の効果を回避した。`);
    } else if(choice==="nullify"){
      // 武人「阿国」：手札の「折紙」を1枚捨てて行動カードの効果を丸ごと無効化
      if(p.bujin!=="阿国") return false;
      const idx = p.hand.findIndex(c=>c.uid===cardUid && c.suit==="折紙");
      if(idx===-1) return false;
      const [card] = p.hand.splice(idx,1);
      pushDiscard(state, card);
      log(state, `${p.name} が「${card.name}」を捨てて「${pac.cardName}」の効果を無効化した（阿国）。`);
    } else {
      let dmg = 1;
      if(farmerUid){
        const fidx = p.kakugo.findIndex(c=>c.uid===farmerUid && c.name==="農民");
        if(fidx!==-1){
          const [fc] = p.kakugo.splice(fidx,1);
          pushDiscard(state, fc);
          dmg = Math.max(0, dmg-1);
          log(state, `${p.name} が「農民」を捨てて負傷を1点軽減した。`);
          fireCardEvent(state, "kakugo", p.name, "農民", "：負傷を1点軽減");
        }
      }
      if(dmg>0) loseSoul(state, ME.id, dmg, pac.playerId);
      else log(state, `${p.name} は「農民」のおかげで負傷を免れた。`);
    }
    pac.responded.push(ME.id);
    if(pac.responded.length>=pac.targets.length){
      log(state, `「${pac.cardName}」の処理が完了した。`);
      state.pendingActionCard=null;
    }
  });
  GAME=await loadGame(CODE); render();
}

    const pac = state.pendingActionCard;
    if(!pac || pac.mode!=="chokkanPick") return false;
    if(pac.playerId!==ME.id) return false;
    const chosen = pac.submissions[fromId];
    if(!chosen) return false;
    state.playerState[ME.id].hand.push(chosen);
    log(state, `${state.playerState[ME.id].name} が ${state.playerState[fromId].name} の公開したカード「${chosen.name}」を手札に加えた（直観）。`);
    Object.keys(pac.submissions).forEach(pid=>{
      if(pid!==fromId){ state.playerState[pid].hand.push(pac.submissions[pid]); }
    });
    state.pendingActionCard=null;
    maybeTriggerKote(state, ME.id);
  });
  GAME=await loadGame(CODE); render();
}

async function declareAttack(weaponUid, targetId){
  await updateGame(CODE, (state)=>{
    const id = state.seatOrder[state.turnIndex];
    if(id!==ME.id || state.turnPhase!=="action") return false;
    if(state.pendingAttack || state.pendingActionCard || state.pendingKote || state.pendingReveal || state.pendingBushido || state.pendingKaeshi || state.pendingKuni || state.pendingDate || state.pendingKusari || state.pendingGameStart) return false;
    const p = state.playerState[id];
    const idx = p.hand.findIndex(c=>c.uid===weaponUid);
    if(idx===-1) return false;
    const weapon = p.hand[idx];
    const countsTowardLimit = !(p.bujin==="信玄" && weapon.suit==="富士山");
    if(countsTowardLimit && (p.weaponsUsedThisTurn||0) >= weaponLimit(state,id)) return false;
    const range = computeRange(state, id, targetId, weapon.name);
    const effectiveRange = (p.bujin==="小次郎") ? 0 : range;
    if(effectiveRange > weapon.range) return false;
    p.hand.splice(idx,1);
    const isKozuka = weapon.name==="小柄";
    if(!isKozuka) pushDiscard(state, weapon); // 小柄は結果が出るまで手札にも捨て札にも属さず保留する
    if(countsTowardLimit) p.weaponsUsedThisTurn = (p.weaponsUsedThisTurn||0)+1;
    let power = weapon.power;
    if(power==="kakugo") power = state.playerState[targetId].kakugo.length;
    if(power==="honor") power = Math.max(0,state.playerState[targetId].honor);
    if(typeof power==="number"){
      const iaiCount = p.kakugo.filter(k=>k.name==="居合").length;
      if(iaiCount>0) power += iaiCount; // 覚悟「居合」：場に出ている枚数分、重複して+1ずつ
      if(p.bujin==="武蔵") power += 1; // 武人「武蔵」
    }
    state.pendingAttack = {id:uid(), attackerId:id, targetId, weaponName:weapon.name, weaponSuit:weapon.suit, power, range, weaponUid: isKozuka?weapon.uid:null};
    log(state, `${p.name} が ${state.playerState[targetId].name} に「${weapon.name}」で攻撃（間合い${range}、威力${power}）。`);
    fireAttackEvent(state, p.name, p.bujin, weapon.name, `で ${state.playerState[targetId].name} を攻撃！`);
    // 武人「卜伝」：「鳥居」カード使用でカードを1枚引ける（武器カードにも適用）
    if(p.bujin==="卜伝" && weapon.suit==="鳥居"){
      drawCards(state, id, 1);
      log(state, `${p.name}（卜伝）がカードを1枚引いた。`);
      fireBujinEvent(state, p.name, "卜伝", "：カードを1枚引いた");
    }
    // 覚悟「重藤の弓」相当（武器名で判定）：この攻撃の後、追加でもう1枚武器カードを使用できる
    if(weapon.name==="重藤の弓"){
      p.weaponBonusThisTurn = (p.weaponBonusThisTurn||0)+1;
      log(state, `${p.name} は「重藤の弓」の効果で、続けてもう1枚武器カードを使用できる。`);
    }
  });
  GAME=await loadGame(CODE); render();
}
function applyAttackResolve(state, method, parryCardUid, farmerUid){
  const pa = state.pendingAttack;
  if(!pa) return false;
  const target = state.playerState[pa.targetId];
  const attackerId = pa.attackerId;
  let damageDealt = false;
  if(method==="parry"){
      const idx = target.hand.findIndex(c=>c.uid===parryCardUid);
      let card, fromKakugo=false;
      if(idx!==-1){ card = target.hand[idx]; }
      else {
        // 武人「官兵衛」：捌きの代わりに場の覚悟カードを1枚捨てられる
        const kidx = target.kakugo.findIndex(c=>c.uid===parryCardUid);
        if(target.bujin==="官兵衛" && kidx!==-1){ card = target.kakugo[kidx]; fromKakugo=true; }
        else return false;
      }
      const isForcedWeapon = pa.weaponName==="契木";
      if(isForcedWeapon && card.kind!=="武器") return false;
      if(fromKakugo){ target.kakugo.splice(target.kakugo.findIndex(c=>c.uid===parryCardUid),1); }
      else { target.hand.splice(idx,1); }
      pushDiscard(state,card);
      log(state, `${target.name} が「${card.name}」で攻撃を捌いた。負傷なし。`);
      fireCardEvent(state, "parry", target.name, card.name, `で「${pa.weaponName}」を捌いた`);
      // 行動「切り返し」：捌いた後、攻撃者は「捌き」を1枚捨てるか1点の負傷を受けるかを選ぶ
      if(card.name==="切り返し" && attackerId){
        state.pendingKaeshi = {id:uid(), attackerId, defenderId: pa.targetId};
        log(state, `「切り返し」の効果で、${state.playerState[attackerId].name} は「捌き」を1枚捨てるか1点の負傷を受けるかを選ぶ。`);
      }
    } else {
      let power = pa.power;
      // 武人「謙信」：武器カードでは「折紙」からしか負傷を受けない
      if(target.bujin==="謙信" && pa.weaponSuit!=="折紙"){ power = 0; log(state, `${target.name}（謙信）は「折紙」以外の武器では負傷しない。`); }
      // 武人「誾千代」：武器で受ける負傷が1点減少（0点以下にはならない＝元々0点だった場合を除き、最低でも1点は受ける）
      if(power>0 && target.bujin==="誾千代"){ power = Math.max(1, power-1); log(state, `${target.name}（誾千代）は負傷が1点軽減された。`); }
      // 武人「茶々」：2枚開示。スートが同じなら負傷を受けない
      if(power>0 && target.bujin==="茶々"){
        const revealed = revealCards(state,2);
        if(revealed.length===2){
          let txt = `${target.name}（茶々）が2枚開示：「${revealed[0].name}」（${revealed[0].suit}）「${revealed[1].name}」（${revealed[1].suit}）`;
          if(revealed[0].suit===revealed[1].suit){ power=0; txt += ` → スートが一致したため負傷を受けない。`; }
          announceReveal(state, txt, revealed);
        }
      }
      // 覚悟「農民」：1点負傷の代わりに場のカードを1枚捨てる
      if(power>0 && farmerUid){
        const fidx = target.kakugo.findIndex(c=>c.uid===farmerUid && c.name==="農民");
        if(fidx!==-1){
          const [fc] = target.kakugo.splice(fidx,1);
          pushDiscard(state,fc);
          power = Math.max(0, power-1);
          log(state, `${target.name} が「農民」を捨てて負傷を1点軽減した。`);
          fireCardEvent(state, "kakugo", target.name, "農民", "：負傷を1点軽減");
        }
      }
      if(power>0){
        damageDealt = true;
        const isSelfTanto = pa.weaponName==="短刀" && attackerId===pa.targetId;
        const beforeSoul = target.soul;
        loseSoul(state, pa.targetId, power, attackerId, true);
        // 武器「短刀」：自分に使用し、それによって最後の魂コマを失った場合、名誉点を失わず、手番終了時に名誉点+1
        if(isSelfTanto && beforeSoul>0 && target.soul===0){
          target.pendingTantoBonus = true;
          log(state, `${target.name} は「短刀」により最後の魂コマを失った。名誉点は失わず、手番終了時に名誉点+1を得る。`);
        }
        // 武器「鎖分銅」：この攻撃で負傷したプレイヤーは、自分の手札を1枚選んで捨てる
        if(pa.weaponName==="鎖分銅" && target.hand.length>0){
          state.pendingKusari = {id:uid(), targetId: pa.targetId};
        }
        // 武人「巴御前」：自分の武器攻撃で他プレイヤーに負傷を与えた時、カードを1枚引く
        if(attackerId!==pa.targetId && state.playerState[attackerId] && state.playerState[attackerId].bujin==="巴御前"){
          drawCards(state, attackerId, 1);
          log(state, `${state.playerState[attackerId].name}（巴御前）がカードを1枚引いた。`);
          fireBujinEvent(state, state.playerState[attackerId].name, "巴御前", "：カードを1枚引いた");
        }
        // 武人「牛若」：武器で受けた負傷1点につきカードを1枚引く
        if(target.bujin==="牛若"){
          drawCards(state, pa.targetId, power);
          log(state, `${target.name}（牛若）がカードを${power}枚引いた。`);
          fireBujinEvent(state, target.name, "牛若", `：カードを${power}枚引いた`);
        }
        // 武人「幸村」：他プレイヤーからダメージを受けた時に開示。「折紙」ならそのプレイヤーが1点の負傷を受ける
        if(attackerId!==pa.targetId && target.bujin==="幸村" && attackerId){
          const rv = revealCards(state,1);
          if(rv.length===1){
            let txt = `${target.name}（幸村）が開示：「${rv[0].name}」（${rv[0].suit}）`;
            if(rv[0].suit==="折紙"){ loseSoul(state, attackerId, 1, pa.targetId); txt += ` → 「折紙」のため ${state.playerState[attackerId].name} が1点の負傷を受けた。`; }
            announceReveal(state, txt, rv);
          }
        }
      } else {
        log(state, `${target.name} は負傷を受けなかった。`);
      }
    }
    // 武器「小柄」：負傷を与えられた場合は即座に手札へ戻る。与えられなければ捨て札になる
    if(pa.weaponUid){
      const kozuka = hydrateCard({uid:pa.weaponUid, name:pa.weaponName, kind:"武器"});
      if(damageDealt && state.playerState[attackerId]){
        state.playerState[attackerId].hand.push(kozuka);
        log(state, `「小柄」は負傷を与えたため、${state.playerState[attackerId].name} の手札に戻った。`);
      } else {
        pushDiscard(state, kozuka);
      }
    }
    state.pendingAttack=null;
  return true;
}
async function resolveAttack(method, parryCardUid, farmerUid){
  await updateGame(CODE, (state)=>{
    const pa = state.pendingAttack;
    if(!pa || pa.targetId!==ME.id) return false;
    if(applyAttackResolve(state, method, parryCardUid, farmerUid)===false) return false;
  });
  GAME=await loadGame(CODE); render();
}
async function manualAdjust(field, delta, farmerUid){
  await updateGame(CODE, (state)=>{
    const p = state.playerState[ME.id];
    if(!p) return false;
    if(field==="soul"){
      let d = delta;
      if(d<0 && farmerUid){
        const fidx = p.kakugo.findIndex(c=>c.uid===farmerUid && c.name==="農民");
        if(fidx!==-1){
          const [fc] = p.kakugo.splice(fidx,1);
          pushDiscard(state, fc);
          d = Math.min(0, d+1);
          log(state, `${p.name} が「農民」を捨てて負傷を1点軽減した。`);
          fireCardEvent(state, "kakugo", p.name, "農民", "：負傷を1点軽減");
        }
      }
      const before=p.soul;
      p.soul = Math.max(0, Math.min(p.maxSoul, p.soul+d));
      log(state, `${p.name} が魂コマを手動調整（${before}→${p.soul}）`);
      if(before>0 && p.soul===0){
        loseHonor(state, ME.id, 1);
        log(state, `${p.name} が討たれた扱いになった。名誉点-1。（攻撃者不明のため名誉点の受け渡し・無双判定は各自で確認してください）`);
        state.lastHonorZeroEvent={attackerId:null,victimId:ME.id};
        state.lastEliminationEvent={attackerId:null,victimId:ME.id};
        if(p.kakugo.some(k=>k.name==="呪い")){
          const dropped = p.kakugo.slice();
          p.kakugo = [];
          dropped.forEach(c=>pushDiscard(state,c));
          log(state, `${p.name} の「呪い」が発動し、場の覚悟カードがすべて捨て札になった。`);
          fireCardEvent(state, "kakugo", p.name, "呪い", "が発動");
        }
        // 新ルール「バンザイ！」：体力と同じ枚数を山札の上から捨てる
        banzaiDiscard(state, ME.id);
      }
      checkGameEnd(state);
      if(state.phase!=="ended") checkMuso(state, null);
    } else if(field==="honor"){
      const before=p.honor;
      if(delta<0) loseHonor(state, ME.id, -delta);
      else p.honor = p.honor+delta;
      log(state, `${p.name} が名誉点を手動調整（${before}→${p.honor}）`);
      checkGameEnd(state);
    } else if(field==="draw"){
      if(state.deck.length===0 && state.discard.length>0){
        state.deck=shuffle(state.discard); state.discard=[];
        log(state, `山札切れ（手動ドロー時）。捨て札から新しい山札を作成。`);
      }
      const c = state.deck.shift();
      if(c){ p.hand.push(c); log(state, `${p.name} が手動でカードを1枚引いた。`); }
    }
  });
  GAME=await loadGame(CODE); render();
}

function soulGaugeHtml(soul, maxSoul){
  let segs = "";
  for(let i=0;i<maxSoul;i++){

  }

function honorGaugeHtml(honor){
  const cap = 8;
  const filled = Math.max(0, Math.min(honor, cap));
  let coins = "";
  for(let i=0;i<cap;i++){
    coins += `<span class="honor-coin ${i<filled?'filled':''}"></span>`;
  }
  const overflow = honor>cap ? `<span class="honor-overflow">+${honor-cap}</span>` : "";
  return `<div class="honor-gauge">${coins}${overflow}</div>`;
}

function showLogModal(state){
  const box=document.getElementById("modal-box");
  box.className="wide";
  box.innerHTML = `<h3>全ログ</h3>
    <div class="row" id="log-filter-row" style="margin-bottom:8px"></div>

  box.querySelector("#modal-close-btn").onclick=closeModal;
  const filterRow = box.querySelector("#log-filter-row");
  const listEl = box.querySelector("#log-modal-list");
  const all = (state.log||[]);
  function draw(){
    const f = LOG_FILTERS.find(x=>x.key===logFilterKey) || LOG_FILTERS[0];
    const rows = all.map((l,i)=>({l,i})).filter(x=>f.test(x.l)).reverse();
    listEl.innerHTML = "";
    if(rows.length===0){
      listEl.appendChild(el(`<div class="muted" style="padding:6px 2px">該当するログはありません。</div>`));

    filterRow.querySelectorAll("button").forEach(b=>{
      b.className = "btn-sm " + (b.dataset.key===logFilterKey ? "btn-main" : "btn-ghost");

  }
  LOG_FILTERS.forEach(f=>{

    const b = el(`<button class="btn-sm btn-ghost" data-key="${f.key}">${esc(f.label)}（${cnt}）</button>`);
    b.onclick=()=>{ logFilterKey=f.key; draw(); };

  });

  document.getElementById("modal-overlay").dataset.noDismiss="";
}
function showDiscardListModal(state){

function cardTotalCount(name){
  let t = 0;
  WEAPON_DATA.forEach(([nm,,count])=>{ if(nm===name) t = count; });
  KAKUGO_DATA.forEach(([nm,,count])=>{ if(nm===name) t = count; });
  ACTION_DATA.forEach(([nm,,count])=>{ if(nm===name) t = count; });
  return t;
}
// 現在のレイアウト（1カラム／2カラム）で、盤面（.table-wrap）が実際に取れる横幅をおおよそ見積もる。
// 実測ではなく見積もりなので、安全側（やや小さめ）に倒している。
function estimateBoardWidth(){
  const vw = window.innerWidth;
  if(vw < 960){
    const contentWidth = Math.min(vw, 1180) - 28;
    return Math.max(260, contentWidth);
  }
  const contentWidth = vw - 48; // ゲーム画面は #app.app-full（max-width:none / 左右padding24px）
  const rightWidth = Math.min(600, contentWidth/2 - 20);
  return Math.max(260, contentWidth - rightWidth - 20);
}
// 人数ごとの基準レイアウトを、実際の盤面幅に収まるように縮小する（座席カードが卓からはみ出さないようにする）
function computeSeatLayout(n, containerWidth){
  const base = {
    3:{h:430, rx:36, ry:33, w:200},
    4:{h:460, rx:38, ry:35, w:200},
    5:{h:480, rx:40, ry:36, w:195},
    6:{h:500, rx:41, ry:37, w:190},
    7:{h:530, rx:42, ry:38, w:182},
    8:{h:560, rx:43, ry:39, w:174}
  }[n] || {h:530, rx:42, ry:38, w:182};
  let {h, rx, ry, w} = base;
  const minW = 112; // これ以上縮めると座席内の文字が読めなくなる下限
  if(containerWidth>0){
    // 座席カードは中心から角度rx%の位置に幅wpxで中央揃え配置されるため、
    // 「中心からリング外周までの余白(px)」より座席カード半分の幅が大きいとはみ出す。
    let marginPx = (50-rx)/100*containerWidth;
    if(w/2 > marginPx){
      // まずリング半径を少し詰めて余白を稼ぎ、それでも足りなければ座席カード自体を縮める
      rx = Math.max(28, rx-8);
      marginPx = (50-rx)/100*containerWidth;
      w = Math.max(minW, Math.min(w, Math.floor(marginPx*2)));
      // 縦方向のringの高さも、縮めた分だけ少し詰めて余白のバランスを取る
      h = Math.max(360, Math.round(h * (w/base.w)));
    }
  }
  return {h, rx, ry, w};
}
function renderSeats(state){
  if(isMobileView()) return renderSeatsMobile(state);
  const n = state.seatOrder.length;
  // 人数が増えるほど座席が密集するので、リングの大きさと座席幅を人数に応じて調整する。
  // さらに、実際に確保できる盤面の横幅に収まるよう追加で縮小する（座席が卓からはみ出るのを防ぐ）。
  const layout = computeSeatLayout(n, estimateBoardWidth());
  const cx=50, cy=50, rx=layout.rx, ry=layout.ry;
  const ring = el(`<div class="seat-ring" style="height:${layout.h}px"></div>`);
  state.seatOrder.forEach((id,i)=>{
    const p = state.playerState[id];
    const angle = (Math.PI*2*i/n) - Math.PI/2;
    const left = cx + rx*Math.cos(angle);
    const top = cy + ry*Math.sin(angle);
    const isTurn = state.seatOrder[state.turnIndex]===id;
    const dead = p.soul<=0;
    const seat = el(`<div class="seat ${id===ME.id?'me':''} ${isTurn?'turn':''} ${dead?'dead':''}" style="left:${left}%;top:${top}%;width:${layout.w}px">
      ${seatInnerHtml(state, id)}
    </div>`);
    ring.appendChild(seat);
  });

  const cluster = el(`<div class="center-cluster"></div>`);
  const info = el(`<div class="center-info">
      <div class="deck-count">${state.deck.length}</div>
      <div class="muted" style="font-size:10px">山札</div>
      <div class="big" style="margin-top:6px">${esc(state.playerState[state.seatOrder[state.turnIndex]].name)}の番</div>
      <div class="muted" style="font-size:10px">${phaseLabel(state.turnPhase)}</div>
  </div>`);
  cluster.appendChild(info);
  cluster.appendChild(renderDiscardBoard(state));
  ring.appendChild(cluster);

  const wrap = el(`<div class="table-wrap"><div class="table-wrap-bg"></div></div>`);
  wrap.appendChild(ring);
  return wrap;
}

      let myParryCards = p.hand.filter(c=> isForcedWeapon ? c.kind==="武器" : (c.parry || (semboAllowed && c.kind==="武器")));
      const myParryKakugo = (p.bujin==="官兵衛" && !isForcedWeapon) ? p.kakugo : []; // 武人「官兵衛」：捌きの代わりに場の覚悟カードを1枚捨ててよい
      const banner = el(`<div class="card-box attack-banner">
        <b>${esc(atkP.name)}</b> があなたに「${esc(pa.weaponName)}」で攻撃（威力${pa.power}）！
        <div class="row" style="margin-top:8px">
          <button class="btn-ghost btn-sm" id="btn-accept">負傷を受ける</button>
        </div>
        <div style="margin-top:8px">
          <div class="muted">捌きに使えるカード：${(myParryCards.length+myParryKakugo.length)? '' : 'ありません'}</div>
          <div class="hand-strip" id="parry-cards"></div>
        </div>
      </div>`);
      banner.querySelector("#btn-accept").onclick=()=>{
        maybeOfferFarmer(p.kakugo, (farmerUid)=>resolveAttack("accept", null, farmerUid));
      };
      myParryCards.forEach(c=>{
        const cd = cardEl(c,{onClick:()=>resolveAttack("parry", c.uid)});
        banner.querySelector("#parry-cards").appendChild(cd);
      });
      myParryKakugo.forEach(c=>{
        const cd = cardEl(c,{onClick:()=>resolveAttack("parry", c.uid)});
        const tag = el(`<div class="muted" style="font-size:9px">官兵衛：場の覚悟カード</div>`);
        cd.appendChild(tag);
        banner.querySelector("#parry-cards").appendChild(cd);
      });
      myBanner = banner;
    } else {
      wrap.appendChild(el(`<div class="card-box attack-banner">攻撃の解決待ち：${esc(state.playerState[pa.attackerId].name)} → ${esc(state.playerState[pa.targetId].name)}（「${esc(pa.weaponName)}」）</div>`));
    }
  }

  // pending kusari notification (鎖分銅：手札から1枚選んで捨てる)
  if(state.pendingKusari){
    const pk = state.pendingKusari;
    const tgt = state.playerState[pk.targetId];
    const isTarget = pk.targetId===ME.id;
    const banner = el(`<div class="card-box attack-banner">
      <b>${esc(tgt.name)}</b> は「鎖分銅」の効果で、自分の手札から1枚選んで捨てます。
    </div>`);
    if(isTarget){
      const box = el(`<div class="hand-strip" id="kusari-pick" style="margin-top:8px"></div>`);
      banner.appendChild(box);
      p.hand.forEach(c=>{
        const cd = cardEl(c,{onClick:()=>resolveKusari(c.uid)});
        box.appendChild(cd);
      });
      myBanner = banner;
    } else {
      banner.appendChild(el(`<div class="muted" style="margin-top:6px">${esc(tgt.name)} が選んでいます…</div>`));
    }
    if(myBanner!==banner) wrap.appendChild(banner);
  }

  // pending kuni notification (阿国：行動カードの効果を無効化するか選択)
  if(state.pendingKuni){
    const pk = state.pendingKuni;
    const tgt = state.playerState[pk.targetId];
    const isTarget = pk.targetId===ME.id;
    const banner = el(`<div class="card-box attack-banner">
      <b>${esc(tgt.name)}</b>（阿国）が「${esc(pk.cardName)}」の対象になりました。<br>
      <span class="muted">効果：${esc(pk.effect)}</span>
    </div>`);
    if(isTarget){
      const folCards = p.hand.filter(c=>c.suit==="折紙");
      const box = el(`<div style="margin-top:8px">
        <div class="row">
          <button class="btn-ghost btn-sm" id="btn-kuni-accept">効果を受け入れる</button>
        </div>
        <div class="muted" style="margin-top:6px">「折紙」を捨てて無効化する：</div>
        <div class="hand-strip" id="kuni-cards"></div>
      </div>`);
      box.querySelector("#btn-kuni-accept").onclick=()=>resolveKuni(false);
      folCards.forEach(c=>{
        const cd = cardEl(c,{onClick:()=>resolveKuni(true, c.uid)});
        box.querySelector("#kuni-cards").appendChild(cd);
      });
      banner.appendChild(box);
      myBanner = banner;
    } else {
      banner.appendChild(el(`<div class="muted" style="margin-top:6px">${esc(tgt.name)} が選んでいます…</div>`));
    }
    if(myBanner!==banner) wrap.appendChild(banner);
  }

  // pending kaeshi notification (切り返し：攻撃者の応答待ち)
  if(state.pendingKaeshi){
    const pk = state.pendingKaeshi;
    const atk = state.playerState[pk.attackerId];
    const def = state.playerState[pk.defenderId];
    const isAttacker = pk.attackerId===ME.id;
    const banner = el(`<div class="card-box attack-banner">
      <b>${esc(def.name)}</b> の「切り返し」により、<b>${esc(atk.name)}</b> は「捌き」を1枚捨てるか、1点の負傷を受けるかを選びます。<br>
      <span class="muted">魂コマが0になった場合、${esc(atk.name)} は ${esc(def.name)} に名誉点を1点渡し、直ちに手番を終了します。</span>
    </div>`);
    if(isAttacker){
      const sabakiCards = p.hand.filter(c=>c.name==="捌き");
      const box = el(`<div style="margin-top:8px">
        <div class="row">
          <button class="btn-ghost btn-sm" id="btn-kaeshi-damage">1点の負傷を受ける</button>
        </div>
        <div class="muted" style="margin-top:6px">「捌き」を捨てて回避する：${sabakiCards.length? '' : '該当カードなし（負傷を受けるしかありません）'}</div>
        <div class="hand-strip" id="kaeshi-cards"></div>
      </div>`);
      box.querySelector("#btn-kaeshi-damage").onclick=()=>{
        maybeOfferFarmer(p.kakugo, (farmerUid)=>resolveKaeshi("damage", null, farmerUid));
      };
      sabakiCards.forEach(c=>{
        const cd = cardEl(c,{onClick:()=>resolveKaeshi("discard", c.uid)});
        box.querySelector("#kaeshi-cards").appendChild(cd);
      });
      banner.appendChild(box);
      myBanner = banner;
    } else {
      banner.appendChild(el(`<div class="muted" style="margin-top:6px">${esc(atk.name)} が選んでいます…</div>`));
    }
    if(myBanner!==banner) wrap.appendChild(banner);
  }

  // pending kote notification (籠手：カードを引かせる相手の選択待ち)
  if(state.pendingKote){
    const pk = state.pendingKote;
    const owner = state.playerState[pk.ownerId];
    const isOwner = pk.ownerId===ME.id;
    const banner = el(`<div class="card-box attack-banner">
      <b>${esc(owner.name)}</b> の「籠手」が発動しました。誰か1人がカードを1枚引きます。
    </div>`);
    if(isOwner){
      const box = el(`<div class="hand-strip" id="kote-pick" style="margin-top:8px"></div>`);
      banner.appendChild(box);
      state.seatOrder.forEach(pid=>{
        const btn = el(`<button class="modal-target-btn" style="width:auto">${esc(state.playerState[pid].name)}${pid===ME.id?'（自分）':''}</button>`);
        btn.onclick=()=>resolveKote(pid);
        box.appendChild(btn);
      });
      myBanner = banner;
    } else {
      banner.appendChild(el(`<div class="muted" style="margin-top:6px">${esc(owner.name)} が選んでいます…</div>`));
    }
    if(myBanner!==banner) wrap.appendChild(banner);
  }

  // pending action card notification (行動カードの効果処理待ち)
  if(state.pendingActionCard){
    const pac = state.pendingActionCard;
    const actorName = state.playerState[pac.playerId].name;
    const isActor = pac.playerId===ME.id;

    if(pac.mode==="multiResponse"){
      const stillWaiting = pac.targets.filter(t=>!pac.responded.includes(t)).map(t=>state.playerState[t].name);
      const banner = el(`<div class="card-box attack-banner">
        <b>${esc(actorName)}</b> が行動カード「${esc(pac.cardName)}」を使用しました。<br>
        <span class="muted">効果：${esc(pac.effect)}</span><br>
        <span class="muted">応答待ち：${stillWaiting.map(esc).join("、")||"（全員応答済み）"}</span>
      </div>`);
      if(pac.targets.includes(ME.id) && !pac.responded.includes(ME.id)){
        const need = pac.kind==="discardWeaponOrDamage" ? "武器" : "捌き";
        const myCards = p.hand.filter(c=> pac.kind==="discardWeaponOrDamage" ? c.kind==="武器" : c.name==="捌き");
        const respBox = el(`<div style="margin-top:8px">
          <div class="row">
            <button class="btn-ghost btn-sm" id="btn-take-damage">1点の負傷を受ける</button>
          </div>
          <div class="muted" style="margin-top:6px">「${need}」を捨てて回避する：${myCards.length?'':'該当カードなし（負傷を受けるしかありません）'}</div>
          <div class="hand-strip" id="resp-cards"></div>
        </div>`);
        respBox.querySelector("#btn-take-damage").onclick=()=>{
          maybeOfferFarmer(p.kakugo, (farmerUid)=>respondMultiResponse("damage", null, farmerUid));
        };
        myCards.forEach(c=>{
          const cd = cardEl(c,{onClick:()=>respondMultiResponse("discard", c.uid)});
          respBox.querySelector("#resp-cards").appendChild(cd);
        });
        if(p.bujin==="阿国"){
          const folCards = p.hand.filter(c=>c.suit==="折紙");
          const kuniBox = el(`<div style="margin-top:8px"><div class="muted">阿国：「折紙」を捨てて丸ごと無効化する：${folCards.length?'':'該当カードなし'}</div><div class="hand-strip" id="kuni-resp-cards"></div></div>`);
          folCards.forEach(c=>{
            const cd = cardEl(c,{onClick:()=>respondMultiResponse("nullify", c.uid)});
            kuniBox.querySelector("#kuni-resp-cards").appendChild(cd);
          });
          respBox.appendChild(kuniBox);
        }
        banner.appendChild(respBox);
        myBanner = banner;
      }
      if(myBanner!==banner) wrap.appendChild(banner);
    } else if(pac.mode==="chokkanCollect"){
      const stillWaiting = pac.targets.filter(t=>!pac.responded.includes(t)).map(t=>state.playerState[t].name);
      const banner = el(`<div class="card-box attack-banner">
        <b>${esc(actorName)}</b> が行動カード「直観」を使用しました。<br>
        <span class="muted">負傷していない全プレイヤーは、手札から1枚選んで公開してください。</span><br>
        <span class="muted">応答待ち：${stillWaiting.map(esc).join("、")||"（全員応答済み）"}</span>
      </div>`);
      if(pac.targets.includes(ME.id) && !pac.responded.includes(ME.id)){
        const respBox = el(`<div class="hand-strip" id="chokkan-hand" style="margin-top:8px"></div>`);
        p.hand.forEach(c=>{
          const cd = cardEl(c,{onClick:()=>submitChokkan(c.uid)});
          respBox.appendChild(cd);
        });
        banner.appendChild(respBox);
        myBanner = banner;
      }
      if(myBanner!==banner) wrap.appendChild(banner);
    } else if(pac.mode==="chokkanPick"){
      const banner = el(`<div class="card-box attack-banner">
        <b>${esc(actorName)}</b> が公開されたカードから1枚を選びます。<br>
      </div>`);
      if(isActor){
        const respBox = el(`<div class="hand-strip" id="chokkan-pool" style="margin-top:8px"></div>`);
        Object.keys(pac.submissions).forEach(pid=>{
          const c = pac.submissions[pid];
          const cd = cardEl(c,{onClick:()=>pickChokkan(pid)});
          const tag = el(`<div class="muted" style="font-size:9px">${esc(state.playerState[pid].name)} が公開</div>`);
          cd.appendChild(tag);
          respBox.appendChild(cd);
        });
        banner.appendChild(respBox);
        myBanner = banner;
      } else {
        banner.appendChild(el(`<div class="muted" style="margin-top:6px">${esc(actorName)} が選んでいます…</div>`));
      }
      if(myBanner!==banner) wrap.appendChild(banner);
    } else {
      // 汎用フォールバック（自動化していない特殊カード用）
      const banner = el(`<div class="card-box attack-banner">
        <b>${esc(actorName)}</b> が行動カード「${esc(pac.cardName)}」を使用しました。<br>
        <span class="muted">効果：${esc(pac.effect)}</span><br>
        <span class="muted">対象になったプレイヤーは、魂コマ・名誉点・手札の調整を各自の操作パネルで行ってください。</span>
        ${isActor? `<div class="row" style="margin-top:8px"><button class="btn-gold btn-sm" id="btn-resolve-action">全員の処理が完了した（次へ進む）</button></div>` : `<div class="muted" style="margin-top:6px">${esc(actorName)} が「処理完了」を押すまで、次の行動には進めません。</div>`}
      </div>`);
      if(isActor) banner.querySelector("#btn-resolve-action").onclick=resolveActionCard;
      wrap.appendChild(banner);
    }
  }

  // turn controls
  if(myTurn && !state.pendingAttack && !state.pendingActionCard && !state.pendingBushido && !state.pendingReveal && !state.pendingKote && !state.pendingKaeshi && !state.pendingKuni && !state.pendingDate && !state.pendingKusari && !state.pendingGameStart){
    if(state.turnPhase==="draw"){
      const b = el(`<div class="card-box"><h2>ドローフェイズ</h2><button class="btn-main" id="btn-draw">山札から${drawCount(state, ME.id)}枚引く</button></div>`);
      b.querySelector("#btn-draw").onclick=doDraw;
      if(p.bujin==="家康" && state.discard.length>0){
        const alt = el(`<button class="btn-ghost btn-sm" id="btn-draw-discard" style="margin-left:8px">家康：捨て札の一番上から1枚＋山札から${Math.max(0, drawCount(state, ME.id)-1)}枚引く</button>`);
        alt.onclick=drawFromDiscardTop;
        b.appendChild(alt);
      }
      wrap.appendChild(b);
    } else if(state.turnPhase==="action"){
      wrap.appendChild(renderActionPhase(state, p));
    } else if(state.turnPhase==="discard"){
      const b = el(`<div class="card-box"><h2>捨て札フェイズ（手札7枚まで）</h2><div class="muted">現在${p.hand.length}枚。<b style="color:var(--vermillion-dark);font-size:14px">あと${p.hand.length-7}枚</b>捨ててください。</div><div class="hand-strip" id="discard-hand"></div></div>`);
      p.hand.forEach(c=>{
        const cd = cardEl(c,{onClick:()=>discardDown(c.uid)});
        b.querySelector("#discard-hand").appendChild(cd);
      });
      wrap.appendChild(b);
    }
  } else if(!myTurn && !state.pendingActionCard && !state.pendingBushido && !state.pendingReveal && !state.pendingKote && !state.pendingKaeshi && !state.pendingKuni && !state.pendingDate && !state.pendingKusari && !state.pendingGameStart){
    wrap.appendChild(el(`<div class="card-box"><span class="muted">${esc(state.playerState[state.seatOrder[state.turnIndex]].name)} の手番です（${phaseLabel(state.turnPhase)}）。</span></div>`));
  }

  wrap.appendChild(statusBox);

  // my hand（参照用）：行動フェイズ・捨て札フェイズは左カラムに操作用の手札が別途出るため、
  // 同じ手札が二重に表示されて紛らわしくならないよう、その間はこちらを非表示にする。
  const handAlreadyShownOnLeft = myTurn && (state.turnPhase==="action" || state.turnPhase==="discard") && !pendingDescriptor(state);
  let handBox = null;
  if(!handAlreadyShownOnLeft){
    handBox = el(`<div class="card-box"><h2>あなたの手札（${p.hand.length}枚）</h2><div class="hand-strip" id="my-hand"></div></div>`);
    p.hand.forEach(c=>{
      const cd = cardEl(c,{});
      handBox.querySelector("#my-hand").appendChild(cd);
    });
    wrap.appendChild(handBox);
  }

  const logBox = el(`<div class="card-box"><h2>ログ</h2>
    <div class="log-box" id="log-box"></div>
    <div class="row" style="margin-top:8px"><button class="btn-ghost btn-sm" id="btn-log-all">それ以前を見る（全${(state.log||[]).length}件）</button></div>
  </div>`);
  const lb = logBox.querySelector("#log-box");
  (state.log||[]).slice(-3).reverse().forEach(l=>{ lb.appendChild(el(`<div>${esc(l)}</div>`)); });
  logBox.querySelector("#btn-log-all").onclick=()=>showLogModal(state);
  wrap.appendChild(logBox);

  // PC表示ではできるだけスクロールが要らないよう、盤面・進行状況を左に、状態・手札・ログを右にまとめる
  // 右カラムはログを最上部に固定表示したいので、自動振り分けの対象からは外し、後で明示的な順番で積み直す
  const rightSet = new Set([statusBox, handBox, logBox]);
  const leftCol = el(`<div class="game-col-left"></div>`);
  const rightCol = el(`<div class="game-col-right"></div>`);
  Array.from(wrap.children).slice(1).forEach(child=>{
    if(rightSet.has(child)) return;
    leftCol.appendChild(child);
  });
  rightCol.appendChild(logBox);
  rightCol.appendChild(statusBox);
  if(handBox) rightCol.appendChild(handBox);
  const columns = el(`<div class="game-columns"></div>`);
  columns.appendChild(leftCol);
  columns.appendChild(rightCol);
  wrap.appendChild(columns);

  // 自分の応答が必要な場面は、既定でポップアップに出す。
  // 「盤面を確認する」を押した場合はポップアップを閉じ、盤面のすぐ下（peekSlot）にこの埋め込みバナーを差し込む。
  const pd0 = pendingDescriptor(state);
  const peekKey = pd0 ? pd0.key+":"+pd0.id : null;
  if(myBanner){
    if(boardPeekFor === peekKey){
      peekSlot.appendChild(myBanner);
      myBanner = null;
    }
  } else {
    boardPeekFor = null;
  }

  syncStatePopups(state, p, myBanner, peekKey);
  return wrap;
}

// ゲームスタート確認・開示確認など「全員に一斉確認」する場面は、画面中央のポップアップ（モーダル）で表示する
// カットイン演出：攻撃・覚悟・行動カード・捌き・武人効果など主要な行動を全員の画面に一度ずつ、順番に表示する
function fireEvent(state, kind, actorName, refName, detail, imgKind, imgRef){
  const q = (state.eventQueue||[]).slice();
  q.push({id:uid(), kind, actorName, refName, detail, imgKind, imgRef});
  state.eventQueue = q.length>8 ? q.slice(-8) : q;
}
function fireCardEvent(state, kind, actorName, cardName, detail){
  fireEvent(state, kind, actorName, cardName, detail, "card", cardName);
}
function fireBujinEvent(state, actorName, bujinName, detail){
  fireEvent(state, "bujin", actorName, bujinName, detail, "bujin", bujinName);
}
function fireAttackEvent(state, actorName, actorBujin, weaponName, detail){
  fireEvent(state, "attack", actorName, weaponName, detail, "bujin", actorBujin);
}

const CUTIN_KIND_LABEL = {attack:"攻撃", kakugo:"覚悟", action:"行動", parry:"捌き", bujin:"武人効果", eliminate:"討伐"};
const CUTIN_KIND_CLASS = {attack:"", kakugo:"k-kakugo", action:"k-action", parry:"k-parry", bujin:"k-bujin", eliminate:"k-eliminate"};
function eventImage(ev){
  if(ev.imgKind==="bujin") return illustUrl((BUJIN_META[ev.imgRef]||{}).illust);
  return illustUrl((CARD_META[ev.imgRef]||{}).illust);
}
let lastSeenEventId = null;
let cutinLocalQueue = [];
let cutinBusy = false;
function maybeQueueEvents(state){
  const q = state.eventQueue||[];
  if(q.length===0) return;
  let startIdx;
  if(!lastSeenEventId){
    startIdx = q.length; // 参加直後は過去分を一気に再生しない
  } else {
    const idx = q.findIndex(e=>e.id===lastSeenEventId);
    startIdx = idx>=0 ? idx+1 : Math.max(0, q.length-1);
  }
  const newOnes = q.slice(startIdx);
  lastSeenEventId = q[q.length-1].id;
  newOnes.forEach(ev=>cutinLocalQueue.push(ev));
  processCutinQueue();
}
function processCutinQueue(){
  if(cutinBusy) return;
  const ev = cutinLocalQueue.shift();
  if(!ev) return;
  cutinBusy = true;
  if(ev.special==="myturn"){
    showMyTurnCutin(ev.p, ()=>{ cutinBusy=false; processCutinQueue(); });
    return;
  }
  // まだ後続が控えている場合は短縮表示にする
  const shortened = cutinLocalQueue.length > 0;
  showGenericCutin(ev, ()=>{ cutinBusy=false; processCutinQueue(); }, shortened);
}
/* ---------- 効果音（和楽器を意識した合成音。外部ファイルは使わない） ---------- */
function audioCtx(){
  if(!AUDIO_CTX){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    AUDIO_CTX = new AC();
  }
  if(AUDIO_CTX.state==="suspended") AUDIO_CTX.resume();
  return AUDIO_CTX;
}
// 拍子木・木魚のような、木を打つ短い音
function playWoodBlock(ctx, t, freq, gain){
  const osc = ctx.createOscillator(), g = ctx.createGain();
  const filt = ctx.createBiquadFilter();
  filt.type="bandpass"; filt.frequency.value=freq; filt.Q.value=3.5;
  osc.type="triangle"; osc.frequency.setValueAtTime(freq, t);
  osc.frequency.exponentialRampToValueAtTime(freq*0.55, t+0.06);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(gain, t+0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.16);
  osc.connect(filt); filt.connect(g); g.connect(ctx.destination);
  osc.start(t); osc.stop(t+0.2);
}
// 鈴・鉦のような、澄んだ余韻のある音
function playBell(ctx, t, freq, gain, dur){
  dur = dur || 1.1;
  [1, 2.41, 3.86].forEach((mult, i)=>{
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type="sine"; osc.frequency.value = freq*mult;
    const amp = gain / (i+1.6);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(amp, t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur*(1-i*0.22));
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t); osc.stop(t+dur+0.1);
  });
}
// 刀を抜く・斬るような、擦れた短いノイズ
function playSlash(ctx, t, gain){
  const len = Math.floor(ctx.sampleRate*0.26);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<len;i++){
    const p = i/len;
    data[i] = (Math.random()*2-1) * Math.pow(1-p, 2.6);
  }
  const src = ctx.createBufferSource(); src.buffer = buf;
  const filt = ctx.createBiquadFilter();
  filt.type="bandpass"; filt.Q.value=1.5;
  filt.frequency.setValueAtTime(900, t);
  filt.frequency.exponentialRampToValueAtTime(4200, t+0.12);
  const g = ctx.createGain();
  g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.26);
  src.connect(filt); filt.connect(g); g.connect(ctx.destination);
  src.start(t); src.stop(t+0.3);
}
// 太鼓のような低い響き
function playDrum(ctx, t, gain){
  const osc = ctx.createOscillator(), g = ctx.createGain();
  osc.type="sine";
  osc.frequency.setValueAtTime(150, t);
  osc.frequency.exponentialRampToValueAtTime(48, t+0.28);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(gain, t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.5);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(t); osc.stop(t+0.55);
}
// 「あなたの番です」専用のファンファーレ（太鼓の一撃＋上昇する鈴の3音＋最後に伸びる余韻）。
// 他の演出音（単発の拍子木・鈴・斬撃）とは明確に違う、華やかで長めの合図にする。
function playMyTurnFanfare(ctx, t){
  playDrum(ctx, t, 0.24);
  playBell(ctx, t+0.08, 587.33, 0.15, 0.45);   // レ
  playBell(ctx, t+0.24, 739.99, 0.16, 0.45);   // ファ#
  playBell(ctx, t+0.40, 987.77, 0.24, 1.5);    // シ（響かせて余韻を残す）
  playWoodBlock(ctx, t+0.40, 1500, 0.14);
}
function playSound(kind){
  if(!SOUND_ON) return;
  let ctx;
  try{ ctx = audioCtx(); }catch(e){ return; }
  if(!ctx) return;
  const t = ctx.currentTime + 0.01;
  switch(kind){
    case "attack":   playSlash(ctx, t, 0.22); playDrum(ctx, t+0.02, 0.16); break;
    case "kakugo":   playBell(ctx, t, 660, 0.14, 1.3); break;
    case "action":   playWoodBlock(ctx, t, 780, 0.2); break;
    case "parry":    playWoodBlock(ctx, t, 1250, 0.22); playBell(ctx, t+0.02, 1480, 0.09, 0.7); break;
    case "bujin":    playBell(ctx, t, 520, 0.13, 1.0); playWoodBlock(ctx, t, 430, 0.1); break;
    case "eliminate":playDrum(ctx, t, 0.26); playBell(ctx, t+0.06, 220, 0.12, 1.6); break;
    case "myturn":   playMyTurnFanfare(ctx, t); break;
    case "notify":   playBell(ctx, t, 880, 0.12, 0.9); break;
    default: playWoodBlock(ctx, t, 800, 0.16);
  }
}
function setSoundOn(on){
  SOUND_ON = on;
  localStorage.setItem("zan_sound", on ? "on" : "off");

function myActionNeeded(state){
  // 自分の応答を待っている状態か、自分の手番かを判定する
  const pa = state.pendingAttack;
  if(pa && pa.targetId===ME.id) return {key:"attack:"+pa.id, label:"攻撃を受けています"};
  const pk = state.pendingKaeshi;
  if(pk && pk.attackerId===ME.id) return {key:"kaeshi:"+pk.id, label:"切り返しへの応答"};
  const pku = state.pendingKuni;
  if(pku && pku.targetId===ME.id) return {key:"kuni:"+pku.id, label:"阿国の選択"};
  const pks = state.pendingKusari;
  if(pks && pks.targetId===ME.id) return {key:"kusari:"+pks.id, label:"手札を1枚捨てる"};
  const pb = state.pendingBushido;
  if(pb && pb.ownerId===ME.id) return {key:"bushido:"+pb.id, label:"武士道の処理"};
  const pd = state.pendingDate;
  if(pd && pd.ownerId===ME.id) return {key:"date:"+pd.id, label:"開示カードの選択"};
  const pko = state.pendingKote;
  if(pko && pko.ownerId===ME.id) return {key:"kote:"+pko.id, label:"籠手の対象選択"};
  const pac = state.pendingActionCard;
  if(pac){
    if(pac.mode==="multiResponse" && pac.targets.includes(ME.id) && !pac.responded.includes(ME.id)) return {key:"multi:"+pac.id, label:"カード効果への応答"};
    if(pac.mode==="chokkanCollect" && pac.targets.includes(ME.id) && !pac.responded.includes(ME.id)) return {key:"chokkan:"+pac.id, label:"直観でカードを公開"};
    if(pac.mode==="chokkanPick" && pac.playerId===ME.id) return {key:"chokkanpick:"+pac.id, label:"直観でカードを選択"};
  }
  const pg = state.pendingGameStart;
  if(pg && !pg.ackBy.includes(ME.id)) return {key:"start:"+pg.id, label:"開始前の確認"};
  const pr = state.pendingReveal;
  if(pr && !pr.ackBy.includes(ME.id)) return {key:"reveal:"+pr.id, label:"開示結果の確認"};
  if(state.seatOrder[state.turnIndex]===ME.id && !pendingDescriptor(state)){
    return {key:"turn:"+state.turnIndex+":"+state.turnPhase, label:"あなたの番です"};
  }
  return null;
}
function updateTurnNotification(state, p){
  const need = myActionNeeded(state);

    document.title = `【！】${need.label} ｜ ${BASE_TITLE}`;

      lastNotifyKey = need.key;

// 行動フェイズで、その手札カードが今すぐ使えるかを判定する。使えない場合は理由を返す。
function cardPlayability(state, p, card){
  if(card.kind==="武器"){
    const countsTowardLimit = !(p.bujin==="信玄" && card.suit==="富士山");
    const lim = weaponLimit(state, ME.id);
    const used = p.weaponsUsedThisTurn||0;
    if(countsTowardLimit && used>=lim){
      return {ok:false, short:"上限到達", reason:`このターンに使える武器カードは${lim}枚までで、すでに${used}枚使用しています。${p.bujin==="信玄"?"\n（信玄の効果により「富士山」の武器はこの上限に数えません）":""}`};
    }
    const ignoreRange = p.bujin==="小次郎";
    const cands = validTargets(state, ME.id, card.name);
    if(cands.length===0){
      return {ok:false, short:"対象なし", reason:"攻撃できる相手がいません。魂コマを失っているプレイヤーや、手札を持たない非武装状態のプレイヤーは武器カードの対象になりません。"};
    }
    if(!ignoreRange){
      const inRange = cands.filter(id=>computeRange(state, ME.id, id, card.name) <= card.range);
      if(inRange.length===0){
        const list = cands.map(id=>`・${state.playerState[id].name}：間合${computeRange(state, ME.id, id, card.name)}`).join("\n");
        return {ok:false, short:"範囲外", reason:`「${card.name}」の間合は${card.range}ですが、その範囲内に攻撃できる相手がいません。\n\n各プレイヤーとの間合い：\n${list}`};
      }
    }
    return {ok:true, highlight:true};
  }
  if(card.kind==="覚悟"){
    if(card.name==="武士道" && state.seatOrder.some(pid=>state.playerState[pid].kakugo.some(k=>k.name==="武士道"))){
      return {ok:false, short:"既に場にある", reason:"「武士道」はすでに場に出ているため、新たに出すことはできません。"};
    }
    return {ok:true};
  }
  // 行動カード
  if(card.name==="捌き" || card.name==="切り返し"){
    return {ok:false, short:"防御用", reason:`「${card.name}」は、他プレイヤーから武器カードによる攻撃を受けた時にのみ使用できます。攻撃を受けたときに表示される選択肢から使ってください。`};
  }
  if(card.name==="連携攻撃"){
    if(p.soul<=1) return {ok:false, short:"魂コマ不足", reason:"「連携攻撃」は自分の魂コマを1個捨てて使用しますが、魂コマが最後の1個のため使用できません。"};
    const cands = otherActivePlayers(state).filter(pid=>state.playerState[pid].soul>1);
    if(cands.length===0) return {ok:false, short:"対象なし", reason:"魂コマが2個以上ある対象プレイヤーがいないため、「連携攻撃」は使用できません。"};
    return {ok:true};
  }
  if(card.name==="模倣"){
    const any = state.seatOrder.some(pid=>state.playerState[pid].kakugo.length>0);
    if(!any) return {ok:false, short:"対象なし", reason:"場に出ている覚悟カードが1枚もないため、「模倣」は使用できません。"};
    return {ok:true};
  }
  if(card.name==="気攻め"){
    const cands = otherActivePlayers(state).filter(pid=>state.playerState[pid].hand.length>0);
    if(cands.length===0) return {ok:false, short:"対象なし", reason:"手札を持っている他のプレイヤーがいないため、「気攻め」は使用できません。"};
    return {ok:true};
  }
  if(card.name==="遊女"){
    // 手札も場のカードも持たない相手しかいない場合は捨てさせるものが無い
    const cands = otherActivePlayers(state).filter(pid=>{
      const t = state.playerState[pid];
      return t.hand.length>0 || t.kakugo.length>0;
    });
    if(cands.length===0) return {ok:false, short:"対象なし", reason:"捨てさせられるカード（手札または場の覚悟カード）を持っている他のプレイヤーがいないため、「遊女」は使用できません。"};
    return {ok:true};
  }
  if(card.name==="呼吸"){
    // 負傷していなければ回復する対象が無く、相手にカードを1枚与えるだけになる
    if(p.soul>=p.maxSoul) return {ok:false, short:"負傷なし", reason:"「呼吸」は自分の負傷をすべて回復するカードですが、あなたは負傷していないため回復する負傷がありません。"};
    return {ok:true};
  }
  if(card.name==="直観"){
    const cands = state.seatOrder.filter(pid=>{
      const t = state.playerState[pid];
      return pid!==ME.id && t.soul===t.maxSoul && t.hand.length>0;
    });
    if(cands.length===0) return {ok:false, short:"対象なし", reason:"負傷しておらず手札を持っている他のプレイヤーがいないため、「直観」は使用できません。"};
    return {ok:true};
  }
  if(card.name==="柔術" || card.name==="気合"){
    // 非武装状態（魂コマ0または手札0）のプレイヤーは影響を受けないため対象から除外する
    const cands = state.seatOrder.filter(pid=>pid!==ME.id && isActive(state,pid));
    if(cands.length===0) return {ok:false, short:"対象なし", reason:`対象にできる他のプレイヤー（非武装状態を除く）がいないため、「${card.name}」は使用できません。`};
    return {ok:true};
  }
  if(card.name==="家臣" || card.name==="茶会"){
    // 山札も捨て札も尽きている場合は引けない（捨て札があればシャッフルして山札に戻る）
    if(state.deck.length===0 && state.discard.length===0){
      return {ok:false, short:"山札なし", reason:`山札も捨て札も残っていないため、「${card.name}」でカードを引くことができません。`};
    }
    return {ok:true};
  }
  return {ok:true};
}
function renderActionPhase(state, p){
  const lim = weaponLimit(state, ME.id);
  const used = p.weaponsUsedThisTurn||0;
  const box = el(`<div class="card-box"><h2>行動フェイズ</h2>
    <div class="muted" style="margin-bottom:8px">手札のカードをクリックして使用してください。武器カードは対象と間合いを自動で確認します。（このターンの武器使用：${used}/${lim}${p.bujin==="信玄"?"／富士の武器は上限に数えません":""}）</div>
    <div class="hand-strip" id="act-hand"></div>
    <div class="row" style="margin-top:10px">
      <button class="btn-gold" id="btn-end-action">手番を終了する</button>
      ${p.bujin==="信長" && p.soul>1 ? `<button class="btn-ghost btn-sm" id="btn-nobunaga">信長：魂コマ1個を払ってカードを1枚引く</button>` : ""}
      ${p.bujin==="左近" && !p.sakonUsedThisTurn && p.soul>1 ? `<button class="btn-ghost btn-sm" id="btn-sakon">左近：魂コマ1個を払って場の覚悟カードを1枚手札に加える</button>` : ""}
    </div>
  </div>`);
  p.hand.forEach(c=>{
    const play = cardPlayability(state, p, c);
    const cd = cardEl(c,{onClick:(card)=>{
      if(!play.ok){ showAlert(play.reason); return; }
      if(card.kind==="武器"){ openAttackPicker(state, card); }
      else if(card.kind==="覚悟"){
        if(CURSE_KAKUGO.includes(card.name)){
          const cands = state.seatOrder.filter(pid=>pid!==ME.id);
          showPlayerPicker(`「${card.name}」を誰の場に出しますか？`, state, cands.map(pid=>({id:pid})), (picked)=>playKakugoOnTarget(card.uid, picked.id), card.effect);
        } else {
          showConfirm(`「${card.name}」を自分の場に出しますか？`, `効果：${card.effect}\n\n一度場に出すと、討伐や特定のカード効果以外では捨てられません。`, ()=>playKakugo(card.uid), "場に出す");
        }
      }
      else if(card.kind==="行動"){ handlePlayActionCard(state, card); }
    }});
    if(!play.ok){
      cd.classList.add("pcard-unusable");
      cd.appendChild(el(`<div class="unusable-tag">${esc(play.short)}</div>`));
    } else if(play.highlight){
      cd.classList.add("pcard-ready");
    }
    box.querySelector("#act-hand").appendChild(cd);
  });
  box.querySelector("#btn-end-action").onclick=endActionPhase;
  const nb = box.querySelector("#btn-nobunaga");
  if(nb) nb.onclick=bujinNobunagaDraw;
  const sk = box.querySelector("#btn-sakon");
  if(sk) sk.onclick=()=>{
    const all=[];
    state.seatOrder.forEach(pid=>{ state.playerState[pid].kakugo.forEach(k=>all.push({owner:pid,card:k})); });
    if(all.length===0){ showAlert("場に出ている覚悟カードがありません。"); return; }
    showTargetPicker("どの覚悟カードを手札に加えますか？", all.map(x=>({label:`${x.card.name}（${state.playerState[x.owner].name}の場）`, id:x.card.uid, ownerId:x.owner})), (picked)=>{
      bujinSakonTakeKakugo(picked.ownerId, picked.id);
    });
  };
  return box;
}
function openCardPicker(title, cards, onPick){
  if(cards.length===0){ showAlert("選べるカードがありません。"); return; }
  showTargetPicker(title, cards.map(c=>({label:`${c.name}${c.suit?'（'+c.suit+'）':''}`, id:c.uid})), onPick);
}
function otherActivePlayers(state){
  const id = ME.id;
  return state.seatOrder.filter(pid=>pid!==id && state.playerState[pid].soul>0);
}
function handlePlayActionCard(state, card){
  const id = ME.id;
  const p = state.playerState[id];
  switch(card.name){
    case "捌き":
    case "切り返し":
      showAlert(`「${card.name}」は他プレイヤーから武器カードによる攻撃を受けた時にのみ使用できます。攻撃を受けたときに表示される選択肢から使ってください。`);
      return;
    case "家臣":
      showConfirm("「家臣」を使用しますか？", "デッキから2枚引きます。\n（手札に残しておくとゲーム終了時に名誉点+1として扱われるので、使わず持っておく選択肢もあります）", ()=>playActionKashin(card.uid));
      return;
    case "茶会":
      showConfirm("「茶会」を使用しますか？", "自分がデッキから3枚、その後、他の全プレイヤーが左隣から順に1枚ずつ引きます。", ()=>playActionChakai(card.uid));
      return;
    case "連携攻撃": {
      if(p.soul<=1){ showAlert("自分の魂コマが最後の1個のため使用できません。"); return; }
      const cands = otherActivePlayers(state).filter(pid=>state.playerState[pid].soul>1);
      if(cands.length===0){ showAlert("対象にできるプレイヤー（魂コマが2個以上）がいません。"); return; }
      showPlayerPicker("誰の魂コマを1個減らしますか？", state, otherActivePlayers(state).map(pid=>({
        id: pid,
        disabled: state.playerState[pid].soul<=1,
        reason: state.playerState[pid].soul<=1 ? "魂コマが最後の1個のプレイヤーは「連携攻撃」の対象にできません。" : ""
      })), (picked)=>playActionRenkei(card.uid, picked.id), "使用すると、あなたも魂コマを1個失います。");
      return;
    }
    case "遊女": {
      const cands = otherActivePlayers(state);
      if(cands.length===0){ showAlert("対象にできるプレイヤーがいません。"); return; }
      showPlayerPicker("誰のカードを捨てさせますか？", state, cands.map(pid=>({id:pid})), (picked)=>{
        const tgt = state.playerState[picked.id];
        showTargetPicker(`${tgt.name} のどこから捨てさせますか？`, [
          {label:`場（覚悟カード：${tgt.kakugo.length}枚）`, id:"field", disabled: tgt.kakugo.length===0},
          {label:`手札から無作為に1枚（${tgt.hand.length}枚）`, id:"hand", disabled: tgt.hand.length===0}
        ], (zone)=>{
          if(zone.id==="field"){
            showTargetPicker(`${tgt.name} の場のどのカードを捨てますか？`, tgt.kakugo.map(k=>({label:k.name, id:k.uid})), (kc)=>playActionYuujoField(card.uid, picked.id, kc.id));
          } else {
            playActionYuujoHand(card.uid, picked.id);
          }
        });
      });
      return;
    }
    case "気攻め": {
      const cands = otherActivePlayers(state).filter(pid=>state.playerState[pid].hand.length>0);
      if(cands.length===0){ showAlert("対象にできるプレイヤー（手札があるプレイヤー）がいません。"); return; }
      showPlayerPicker("誰の手札から無作為に1枚引きますか？", state, otherActivePlayers(state).map(pid=>({
        id: pid,
        disabled: state.playerState[pid].hand.length===0,
        reason: state.playerState[pid].hand.length===0 ? "手札を持っていないプレイヤーからは引けません。" : ""
      })), (picked)=>playActionKizeme(card.uid, picked.id));
      return;
    }
    case "呼吸": {
      const cands = otherActivePlayers(state);
      showConfirm("「呼吸」を使用しますか？", "自分の負傷をすべて回復します。", ()=>{
        if(cands.length===0){ playActionKokyuu(card.uid, null); return; }
        showPlayerPicker("誰にカードを1枚引かせますか？", state, cands.map(pid=>({id:pid})), (picked)=>playActionKokyuu(card.uid, picked.id));
      });
      return;
    }
    case "模倣": {
      const all=[];
      state.seatOrder.forEach(pid=>{ state.playerState[pid].kakugo.forEach(k=>all.push({owner:pid,card:k})); });
      if(all.length===0){ showAlert("場に出ている覚悟カードがありません。"); return; }
      showTargetPicker("どの覚悟カードを手札に加えますか？", all.map(x=>({label:`${x.card.name}（${state.playerState[x.owner].name}の場）`, id:x.card.uid, ownerId:x.owner})), (picked)=>{
        playActionMohou(card.uid, picked.ownerId, picked.id);
      });
      return;
    }
    case "柔術":
      showConfirm("「柔術」を使用しますか？", "他の全プレイヤーは、武器カードを1枚捨てるか1点の負傷を受けるかを選びます。", ()=>playActionMultiResponse(card.uid, "discardWeaponOrDamage"));
      return;
    case "気合":
      showConfirm("「気合」を使用しますか？", "他の全プレイヤーは、「捌き」を1枚捨てるか1点の負傷を受けるかを選びます。", ()=>playActionMultiResponse(card.uid, "discardParryOrDamage"));
      return;
    case "直観":
      showConfirm("「直観」を使用しますか？", "負傷していない全プレイヤーが手札から1枚選んで公開し、あなたはその中から1枚を選んで手札に加えます。", ()=>playActionChokkan(card.uid));
      return;
    default:
      showConfirm(`「${card.name}」を使用しますか？`, `効果：${card.effect}`, ()=>playAction(card.uid));
  }
}
async function playAction(cardUid){
  // 自動化していないカード用の汎用フォールバック
  await updateGame(CODE, (state)=>{
    const id = state.seatOrder[state.turnIndex];
    if(id!==ME.id || state.turnPhase!=="action" || state.pendingAttack || state.pendingActionCard || state.pendingKote || state.pendingReveal || state.pendingBushido || state.pendingKaeshi || state.pendingKuni || state.pendingDate || state.pendingKusari || state.pendingGameStart) return false;
    const c = startPlayCard(state, id, cardUid);
    if(!c) return false;
    state.pendingActionCard = {id:uid(), playerId:id, cardName:c.name, effect:c.effect};
    checkGameEnd(state);
  });
  GAME=await loadGame(CODE); render();
}
function openAttackPicker(state, weaponCard){
  const me = state.playerState[ME.id];
  const countsTowardLimit = !(me.bujin==="信玄" && weaponCard.suit==="富士山");
  if(countsTowardLimit && (me.weaponsUsedThisTurn||0) >= weaponLimit(state, ME.id)){
    showAlert("このターンはもう武器カードを使用できません。"); return;
  }
  const ignoreRange = me.bujin==="小次郎";
  const targets = validTargets(state, ME.id, weaponCard.name).map(id=>{
    const range = computeRange(state, ME.id, id, weaponCard.name);
    const effRange = ignoreRange ? 0 : range;
    return {id, name: id===ME.id? `${state.playerState[id].name}（自分）` : state.playerState[id].name, range, ok: effRange<=weaponCard.range};
  });
  if(targets.length===0){ showAlert(`「${weaponCard.name}」で攻撃できる相手がいません（他に攻撃可能な武人がいません）。`); return; }
  const usableCount = targets.filter(t=>t.ok).length;
  if(usableCount===0 && !ignoreRange){ showAlert(`「${weaponCard.name}」（間合${weaponCard.range}）の範囲内に攻撃できる相手がいません。\n\n各対象との間合い：\n`+targets.map(t=>`${t.name}：間合${t.range}`).join("\n")); return; }
  showPlayerPicker(
    `「${weaponCard.name}」の攻撃対象を選んでください`,
    state,
    targets.map(t=>({
      id: t.id,
      disabled: !t.ok,
      note: ignoreRange ? "間合い無視で攻撃可" : `間合 ${t.range}`,
      reason: t.ok ? "" : `この武器の間合は${weaponCard.range}のため、間合${t.range}のこの相手には届きません。`
    })),
    (picked)=>{ declareAttack(weaponCard.uid, picked.id); },
    `間合 ${weaponCard.range}／威力 ${weaponCard.power==='kakugo'?'覚悟数':weaponCard.power==='honor'?'名誉点数':weaponCard.power}${ignoreRange?'　（小次郎：間合い無視）':''}`
  );
}

function renderEnded(){
  const state=GAME;
  const wrap=el(`<div><div class="hero">${heroSealHtml()}<div style="flex:1"><h1>ゲーム終了</h1><div class="sub">部屋：${esc(state.code)}</div></div>
    <button class="btn-ghost btn-sm" id="btn-back-lobby" style="background:rgba(255,255,255,0.12);color:#fff;border-color:rgba(255,255,255,0.5)">ロビーに戻る</button>
  </div></div>`);
  wrap.querySelector("#btn-back-lobby").onclick=()=>{
    showConfirm("ロビーに戻りますか？", "今回の対戦データは破棄され、全員がロビーに戻ります。", abortGame, "ロビーに戻る");
  };

  if(state.results && state.results.type==="muso"){
    wrap.appendChild(el(`<div class="card-box"><h2>無双制覇！</h2>
      <p>${esc(state.playerState[state.results.winnerId].name)}（${esc(state.playerState[state.results.winnerId].role)}）の陣営「${esc(state.results.winnerTeam)}」の勝利です。魂コマを持つプレイヤーが1人だけになったため、名誉点の集計なしで即座に決着しました。</p>
      ${renderRoleReveal(state)}
    </div>`));
    return wrap;
  }

  const res = state.results;
  if(!res){ wrap.appendChild(el(`<div class="card-box">結果を計算中です。</div>`)); return wrap; }
  const teams = res.teams || {};
  const winners = res.winners || [];
  const doujiTeams = Object.keys(res.doujiUchi||{}).filter(t=>res.doujiUchi[t]);

  const box = el(`<div class="card-box"><h2>最終得点</h2>
    <div id="score-table" style="overflow-x:auto"></div>
    ${doujiTeams.length? `<hr class="rule"><p class="muted">同士討ち：同じ陣営の武人に討たれてゲームが終了したため、<b>${doujiTeams.map(esc).join("、")}</b> は合計から-3点されました。</p>` : ""}
    <hr class="rule">
    <div id="team-totals"></div>
  </div>`);

  // 倍率がなぜその値なのかを一言で示す（手裏剣マークが根拠になる場合はそれを、それ以外は人数・身分による固定倍率である旨を表示）
  function multReasonText(d){
    if(d.shuriken) return `手裏剣${shurikenMarks(d.shuriken)}（${d.shuriken}つ）`;
    if(d.mult===1) return "";
    return `${res.n}人戦・${esc(d.role)}の倍率`;
  }

  const table = box.querySelector("#score-table");
  const tableEl = el(`<table class="score-table-el">
    <thead><tr>
      <th>プレイヤー</th><th>名誉点</th><th></th><th>倍率</th><th></th><th>小計</th><th></th><th>家臣</th><th></th><th>個人合計</th>
    </tr></thead>
    <tbody></tbody>
  </table>`);
  const tbody = tableEl.querySelector("tbody");
  res.detail.forEach(d=>{
    const reason = multReasonText(d);
    const personalTotal = d.subtotal + d.kashin;
    tbody.appendChild(el(`<tr>
      <td><span class="sc-name">${esc(d.name)}</span><span class="sc-reason">${esc(d.role)}／${esc(d.team)}</span></td>
      <td>${d.honor}</td>
      <td class="sc-op">×</td>
      <td>${d.mult}${reason? `<span class="sc-reason">${esc(reason)}</span>`:""}</td>
      <td class="sc-op">=</td>
      <td>${d.subtotal}</td>
      <td class="sc-op">+</td>
      <td>${d.kashin}${d.kashin>0? `<span class="sc-reason">手札の「家臣」</span>`:""}</td>
      <td class="sc-op">=</td>
      <td class="sc-total">${personalTotal}</td>
    </tr>`));
  });
  table.appendChild(tableEl);

  const tt = box.querySelector("#team-totals");
  tt.innerHTML = "<h2>陣営別合計</h2>";
  Object.keys(teams).forEach(t=>{
    const members = res.detail.filter(d=>d.team===t);
    const memberSum = members.reduce((s,d)=>s+d.subtotal+d.kashin,0);
    const penalized = res.doujiUchi && res.doujiUchi[t];
    const breakdown = members.map(d=>`${esc(d.name)} ${d.subtotal+d.kashin}`).join(" + ");
    tt.appendChild(el(`<div class="result-team ${winners.includes(t)?'win':''}">
      <div class="result-row"><b>${esc(t)}</b><b>${teams[t]}点</b></div>
      <div class="muted" style="font-size:11px;margin-top:-2px">${esc(breakdown)}${memberSum!==0? ` = ${memberSum}` : ""}${penalized? `　－　同士討ち 3点　＝　<b>${teams[t]}点</b>` : ""}</div>
      ${winners.includes(t)?'<div class="pill pill-gold" style="margin-top:6px">勝利</div>':''}
    </div>`));
  });

  wrap.appendChild(box);
  wrap.appendChild(el(renderRoleReveal(state)));
  return wrap;
}
function renderRoleReveal(state){
  const rows = state.seatOrder.map(id=>{
    const p=state.playerState[id];
    return `<div class="result-row"><span>${esc(p.name)}</span><span>${esc(p.role)}／${esc(p.bujin)}</span></div>`;
  }).join("");
  return `<div class="card-box"><h2>全員の身分公開</h2>${rows}</div>`;
}

/* ---------- root render ---------- */
function render(){
  const app=document.getElementById("app");
  app.innerHTML="";
  app.classList.toggle("app-full", VIEW==="game");
  if(VIEW!=="game"){ document.title = BASE_TITLE; lastNotifyKey = null; }
  if(VIEW==="loading"){ app.appendChild(el(`<div class="entry-wrap"><p class="muted">読み込み中…</p></div>`)); return; }
  if(VIEW==="entry"){ app.appendChild(renderEntry()); return; }
  if(VIEW==="lobby"){ app.appendChild(renderLobby()); return; }
  if(VIEW==="game"){ app.appendChild(renderGame()); return; }
  if(VIEW==="ended"){ app.appendChild(renderEnded()); return; }
}

let pendingWaitKey=null, pendingWaitSince=0, skipBannerShown=false;
function trackPendingWait(state){
  const d = pendingDescriptor(state);
  const key = d ? d.key+":"+d.id : null;
  if(key !== pendingWaitKey){ pendingWaitKey = key; pendingWaitSince = Date.now(); }
}
function pendingWaitSeconds(){
  return pendingWaitKey ? Math.floor((Date.now()-pendingWaitSince)/1000) : 0;
}
// 応答待ちが閾値を超えたタイミングで一度だけ再描画し、スキップ用ボタンを出す
setInterval(()=>{
  if(!GAME || VIEW!=="game") return;
  const should = !!pendingWaitKey && pendingWaitSeconds()>=SKIP_AFTER_SEC;
  if(should !== skipBannerShown){ skipBannerShown = should; render(); }
}, 1000);

let resizeRenderTimer=null;
window.addEventListener("resize", ()=>{
  clearTimeout(resizeRenderTimer);
  resizeRenderTimer = setTimeout(()=>{ if(GAME) render(); }, 200);
});

boot();
</script>
